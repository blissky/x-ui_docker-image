services:
  x-ui:
    image: ghcr.io/blissky/x-ui:latest
    container_name: x-ui
    # Fail2ban uses iptables inside the container to enforce IP limits.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db:/etc/x-ui/
      - ./cert:/root/cert/
      # Persist acme.sh state so certificate renewal survives recreation.
      - ./acme:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      # The default database is SQLite. PostgreSQL is commented out below;
      # uncomment both the variables here and the postgres service before use.
      # XUI_DB_TYPE: "postgres"
      # XUI_DB_DSN: "postgres://xui:xui@postgres:5432/xui?sslmode=disable"
    tty: true
    ports:
      - "2053:2053"
    restart: unless-stopped

