services:
  x-ui:
    image: ghcr.io/blissky/x-ui:latest
    container_name: x-ui
    # Use the host network namespace so the panel and Xray inbounds bind
    # directly to host ports. Supported on Linux Docker hosts.
    network_mode: host
    # Fail2ban uses iptables inside the container to enforce IP limits.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db:/etc/x-ui/
      - ./cert:/root/cert/
      # Persist acme.sh state so certificate renewal survives recreation.
      - ./acme:/root/.acme.sh/
    environment:
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    restart: unless-stopped
